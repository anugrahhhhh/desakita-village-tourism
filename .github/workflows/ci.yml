name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable

jobs:
  go:
    name: Go (vet, race tests, govulncheck)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal e2e migrations seeds web)"
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.29.0"
      - name: Generated code is up to date
        run: sqlc diff
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: vet, test -race, govulncheck
        run: bash scripts/check.sh

  assets:
    name: Committed front-end assets are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build:css && npm run vendor:htmx && npm run vendor:assets
      - name: No uncommitted changes
        run: git diff --exit-code

  e2e:
    name: End-to-end + accessibility (Playwright, axe-core)
    runs-on: ubuntu-latest
    needs: go
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      E2E_ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  docker:
    name: Docker image builds and becomes ready
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: desakita
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: desakita:ci
      - name: Smoke test (migrate, serve, /readyz)
        run: |
          docker run -d --name app --network host --read-only --tmpfs /tmp \
            -e DATABASE_URL="postgres://postgres:postgres@localhost:5432/desakita?sslmode=disable" \
            -e HTTP_ADDR=127.0.0.1:8080 desakita:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/readyz; then echo; exit 0; fi
            sleep 1
          done
          docker logs app
          exit 1
