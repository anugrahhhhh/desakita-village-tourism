services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: desakita
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-desakita-dev}
      POSTGRES_DB: desakita
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432" # 5433 so it doesn't clash with a local PostgreSQL on 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desakita -d desakita"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      DATABASE_URL: postgres://desakita:${POSTGRES_PASSWORD:-desakita-dev}@db:5432/desakita?sslmode=disable
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      MAIL_FROM: ${MAIL_FROM:-DesaKita <noreply@desakita.local>}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      MAP_TILE_URL: ${MAP_TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
    volumes:
      - uploads:/data/uploads
      - mail:/data/mail
      - tiles:/data/tiles
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
  uploads:
  mail:
  tiles:
