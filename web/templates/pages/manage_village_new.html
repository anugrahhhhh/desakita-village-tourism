{{define "title"}}{{t "village.new.title"}}{{end}}
{{define "head"}}{{template "map_head"}}{{end}}
{{define "content"}}
<div class="mx-auto max-w-2xl">
  <nav class="mb-6 text-sm"><a href="/kelola" class="btn-link">{{t "manage.nav.all_villages"}}</a></nav>
  <h1 class="mb-2 text-2xl font-bold">{{t "village.new.title"}}</h1>
  <p class="mb-6 text-stone-700">{{t "village.new.explain"}}</p>
  <form method="post" action="/kelola/desa/baru" class="card space-y-5" novalidate>
    <input type="hidden" name="csrf_token" value="{{.CSRF}}">
    {{template "village_fields" .Data}}
    <button type="submit" class="btn-primary w-full sm:w-auto">{{t "village.new.submit"}}</button>
  </form>
</div>
{{end}}
