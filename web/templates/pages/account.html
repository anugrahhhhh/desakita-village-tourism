{{define "title"}}{{t "account.title"}}{{end}}
{{define "content"}}
<div class="mx-auto max-w-xl space-y-6">
  <h1 class="text-2xl font-bold">{{t "account.title"}}</h1>
  <dl class="card grid grid-cols-1 gap-3 sm:grid-cols-3">
    <dt class="font-semibold">{{t "field.name"}}</dt><dd class="sm:col-span-2">{{.Viewer.Name}}</dd>
    <dt class="font-semibold">{{t "field.email"}}</dt><dd class="sm:col-span-2 break-all">{{.Viewer.Email}}</dd>
  </dl>

  <section class="card border-red-200">
    <h2 class="text-lg font-bold text-red-800">{{t "account.delete.heading"}}</h2>
    <p class="mt-2 text-stone-700">{{t "account.delete.explain"}}</p>
    <form method="post" action="/akun/hapus" class="mt-4 space-y-4">
      <input type="hidden" name="csrf_token" value="{{.CSRF}}">
      {{with .Data.ErrorKey}}<p role="alert" class="rounded-lg bg-red-50 px-3 py-2 text-red-800">{{t .}}</p>{{end}}
      <div>
        <label for="password" class="field-label">{{t "account.delete.password"}}</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required class="field-input">
      </div>
      <button type="submit" class="btn-danger">{{t "account.delete.submit"}}</button>
    </form>
  </section>
</div>
{{end}}
