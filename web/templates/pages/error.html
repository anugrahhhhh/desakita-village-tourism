{{define "title"}}{{t .Data.TitleKey}}{{end}}
{{define "content"}}
<div class="mx-auto max-w-xl py-10 text-center">
  <h1 class="text-2xl font-bold">{{t .Data.TitleKey}}</h1>
  <p class="mt-3 text-stone-700">{{t .Data.MessageKey}}</p>
  {{with .Data.RequestID}}<p class="mt-3 text-sm text-stone-500">{{t "error.request_id"}}: <code>{{.}}</code></p>{{end}}
  <a href="/" class="btn-primary mt-6">{{t "error.back_home"}}</a>
</div>
{{end}}
