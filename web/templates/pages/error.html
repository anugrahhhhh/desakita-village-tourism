{{define "title"}}{{t .Data.TitleKey}}{{end}}
{{define "content"}}
<div class="mx-auto max-w-xl py-12 text-center">
  <span class="icon mx-auto size-14 rounded-2xl bg-clay-50 p-3 text-clay-700">{{template "i-triangle-alert"}}</span>
  <h1 class="page-title mt-5">{{t .Data.TitleKey}}</h1>
  <p class="mt-3 text-stone-700">{{t .Data.MessageKey}}</p>
  {{with .Data.RequestID}}<p class="mt-3 text-sm text-stone-600">{{t "error.request_id"}}: <code>{{.}}</code></p>{{end}}
  <a href="/" class="btn-primary mt-6">{{t "error.back_home"}}</a>
</div>
{{end}}
